[package]
name = "openscad-ai"
version = "0.2.0"
edition = "2021"
[lib]
name = "openscad_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["macros", "process", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tempfile = "3"
base64 = "0.22"
scraper = "0.24"
which = "8"
rfd = "0.15"
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
